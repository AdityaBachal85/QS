# Postgres and Redis for the API layer, which is the next module.
# The engine and importer need neither -- they run against the workbook with
# `make test` and `make recon`, which is what keeps every calculation rule
# testable in milliseconds.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: qs
      POSTGRES_USER: qs
      POSTGRES_PASSWORD: qs
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qs"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

volumes:
  pgdata:
